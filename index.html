<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>Turni</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111827;color:#f3f6fb;font:14px system-ui;display:grid;place-items:center}
main{text-align:center;padding:16px;max-width:320px}
h1{font-size:20px;margin-bottom:6px}
p{color:#a8b6ca;font-size:13px;line-height:1.4;margin-bottom:14px}
.btn{display:block;width:100%;padding:12px 16px;background:#3979e8;color:white;text-decoration:none;border-radius:8px;font-weight:700;border:none;cursor:pointer;font-size:14px;margin-top:10px}
#installBtn{background:#45d49a;color:#111827;display:none}
</style>
</head>
<body>
<main>
 <h1>Turni</h1>
 <p id="statusText">Controllo versione…</p>
 <button id="installBtn" class="btn">📲 INSTALLA APPLICAZIONE</button>
 <a id="open" class="btn" href="#" style="display:none;">🚀 APRI APPLICAZIONE</a>
</main>
<script>
const APP_URL="https://script.google.com/macros/s/AKfycbyKA31y1DVounPopnAS9LackRS0p9aXLNVZ_J91exSGPyV73B-rJVnwt5057z1mbhRg/exec";
let deferredPrompt;

const installBtn = document.getElementById('installBtn');
const openBtn = document.getElementById('open');
const statusText = document.getElementById('statusText');

openBtn.href = APP_URL;
openBtn.addEventListener('click', (e) => {
  e.preventDefault();
  window.location.assign(APP_URL);
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

if (isStandalone) {
  statusText.textContent = "Caricamento in corso…";
  window.location.replace(APP_URL);
} else {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    statusText.textContent = "Installa l'app per aprirla a tutto schermo:";
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (outcome === 'accepted') {
      statusText.textContent = "Installata! Apertura…";
      setTimeout(() => { window.location.replace(APP_URL); }, 800);
    }
  });

  setTimeout(() => {
    if (!deferredPrompt && !isStandalone) {
      statusText.textContent = "Pronto per l'apertura.";
      openBtn.style.display = 'block';
    }
  }, 2000);
}
</script>
</body>
</html>
