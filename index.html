<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>DZDPWA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b1220}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
#install{position:fixed;z-index:5;right:14px;bottom:14px;padding:12px 17px;border:0;border-radius:10px;background:#245fce;color:white;font:600 14px system-ui;box-shadow:0 3px 16px #0004}
#install[hidden]{display:none}
</style></head><body>
<iframe id="app" title="DZDPWA" allow="clipboard-read; clipboard-write; geolocation; camera; microphone; fullscreen"></iframe>
<button id="install" hidden>Installa DZDPWA</button>
<script>
const APP_URL="https://script.google.com/macros/s/AKfycbyKA31y1DVounPopnAS9LackRS0p9aXLNVZ_J91exSGPyV73B-rJVnwt5057z1mbhRg/exec";
document.getElementById('app').src=APP_URL;
let installPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{
 event.preventDefault();installPrompt=event;document.getElementById('install').hidden=false;
});
document.getElementById('install').addEventListener('click',async()=>{
 if(!installPrompt)return;
 installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;
 document.getElementById('install').hidden=true;
});
window.addEventListener('appinstalled',()=>{
 document.getElementById('install').hidden=true;
});
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
}
</script></body></html>
